[project]
name = "cloud-intelligence-core"
version = "0.0.0"
description = "Read-only Cloud Intelligence device semantics foundation"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["cloud_intelligence"]

[tool.coverage.report]
show_missing = true
fail_under = 90
